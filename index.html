<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f6" />
  <meta name="description" content="本地保存血压记录，查看每日变化趋势。" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <title>血压记 · 每日健康记录</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#today"><span class="brand-mark">＋</span><span>血压记<small>每日健康记录</small></span></a>
      <div class="side-caption">工作台</div>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-page="today"><span>◷</span>今日概览</button>
        <button class="nav-item" data-page="trends"><span>⌁</span>血压趋势</button>
        <button class="nav-item" data-page="history"><span>▦</span>历史记录</button>
      </nav>
      <div class="sidebar-bottom"><div class="privacy-note"><span class="privacy-dot"></span><div><b>数据保存在此设备</b><small>不会上传到云端</small></div></div><button class="nav-item" data-page="settings"><span>⚙</span>设置</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar"><div class="mobile-brand">血压记</div><div class="topbar-date" id="todayDate"></div><div class="top-actions"><span class="local-badge"><i></i> 本地模式</span><button class="avatar" aria-label="个人设置" data-page="settings">我</button></div></header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <nav class="mobile-nav"><button class="active" data-page="today"><span>◷</span>今日</button><button data-page="trends"><span>⌁</span>趋势</button><button class="mobile-add" data-add aria-label="记录血压"><span>＋</span></button><button data-page="history"><span>▦</span>历史</button><button data-page="settings"><span>⚙</span>设置</button></nav>
  <dialog id="recordDialog"><form id="recordForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">MEASUREMENT</span><h2 id="dialogTitle">记录血压</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="关闭">×</button></div><input type="hidden" id="recordId"><div class="input-grid"><label>收缩压 <small>mmHg</small><div class="number-input"><input id="sys" type="number" inputmode="numeric" min="50" max="250" placeholder="120" required><span>高压</span></div></label><label>舒张压 <small>mmHg</small><div class="number-input"><input id="dia" type="number" inputmode="numeric" min="30" max="180" placeholder="80" required><span>低压</span></div></label><label>心率<div class="number-input"><input id="pulse" type="number" inputmode="numeric" min="30" max="220" placeholder="72"><span>心率</span></div></label><label class="time-field">测量时间<input id="measuredAt" type="datetime-local" required></label></div><fieldset class="context-set"><legend>测量情境</legend><div class="context-options"><label><input type="radio" name="context" value="morning"><span>晨起</span></label><label><input type="radio" name="context" value="bedtime"><span>睡前</span></label><label><input type="radio" name="context" value="afterMed"><span>服药后</span></label><label><input type="radio" name="context" value="other" checked><span>其他</span></label></div></fieldset><label class="note-label">备注 <small>可选</small><textarea id="note" rows="3" placeholder="例如：刚运动、情绪紧张"></textarea></label><p class="form-error" id="formError" role="alert"></p><div class="dialog-actions"><button type="button" class="text-button danger hidden" id="deleteRecord">删除记录</button><span></span><button type="button" class="button secondary" id="cancelDialog">取消</button><button type="submit" class="button secondary hidden" id="saveAndContinue">保存并继续</button><button type="submit" class="button primary">保存记录</button></div></form></dialog>
  <dialog id="importPreviewDialog" aria-labelledby="importPreviewTitle"><div class="dialog-head"><div><span class="eyebrow">BACKUP RESTORE</span><h2 id="importPreviewTitle">导入备份预览</h2></div><button type="button" class="icon-button" id="cancelImport" aria-label="取消导入">×</button></div><p class="import-preview-file" id="importPreviewFile"></p><div class="import-preview-range"><span>记录日期</span><b id="importPreviewRange"></b></div><div class="import-preview-counts"><div><b id="importPreviewNew">0</b><span>可新增</span></div><div><b id="importPreviewDuplicates">0</b><span>重复跳过</span></div><div><b id="importPreviewInvalid">0</b><span>无效跳过</span></div></div><p class="import-preview-note">导入只会添加新记录，当前已有数据会保留。</p><div class="import-preview-actions"><button type="button" class="button secondary" id="cancelImportText">取消</button><button type="button" class="button primary" id="applyImport">导入记录</button></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
